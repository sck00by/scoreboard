<!DOCTYPE html>
<html>
<head>
  <title>Live Scoreboard</title>
  <meta http-equiv="refresh" content="10"> <!-- Auto-refresh setiap 10 detik -->
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;700&display=swap" rel="stylesheet">
  <style>
    body {
      background: transparent;
      margin: 0;
      padding: 10px;
      font-family: 'Roboto', sans-serif;
      overflow: hidden;
    }
    table {
      width: 100%;
      border-collapse: collapse;
      background: rgba(20, 20, 20, 0.9);
      color: white;
      border-radius: 8px;
    }
    th {
      background: #6e48aa;
      padding: 10px;
      text-align: center;
    }
    td {
      padding: 8px;
      text-align: center;
      border-bottom: 1px solid rgba(255,255,255,0.1);
    }
    tr:nth-child(even) {
      background: rgba(255,255,255,0.05);
    }
  </style>
</head>
<body>
  <!-- Ambil data dari Google Sheets -->
  <iframe src="https://docs.google.com/spreadsheets/d/1YTb1Q6XBfbROlvYoaUb6VqcWWCII4tsOs8Me8PsbzBo/pubhtml?gid=0&range=A1:F11&single=true&widget=false&headers=false&chrome=false" 
          width="100%" 
          height="500" 
          frameborder="0">
  </iframe>
</body>
</html>
